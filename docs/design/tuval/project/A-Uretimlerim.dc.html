<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My videos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.ay{--bg:#0B0C0A;--surface:#151712;--raised:#1C1F17;--line:#23261E;--edge:#33372B;--edge-strong:#676B5D;--text:#F2F3EC;--text-2:#C9CCBF;--text-3:#A9AC9F;--accent:#C8F03C;--accent-hover:#E0FF7A;--accent-text:#C8F03C;--on-accent:#0B0C0A;--warn:#FF9A6B;--warn-edge:#5A3A2A;--mark-edge:#C8F03C;--scrim:rgba(11,12,10,0.76);--on-scrim:#F2F3EC;--media-edge:transparent;--display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Onest',system-ui,sans-serif}
.ay[data-theme="light"],.ay [data-theme="light"]{--bg:#F4F5EE;--surface:#FFFFFF;--raised:#E8EADF;--line:#E0E2D7;--edge:#CBCEBF;--edge-strong:#80856F;--text:#0B0C0A;--text-2:#3E4236;--text-3:#5A5F50;--accent-hover:#B6E01F;--accent-text:#456300;--warn:#A8400F;--warn-edge:#E3B7A2;--mark-edge:#0B0C0A;--media-edge:rgba(11,12,10,0.12)}
a{color:var(--accent-text)}a:hover{color:var(--text)}
</style>
</helmet>
<div class="ay" data-theme="{{ theme }}" style="min-height: 900px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: var(--body); padding: 0 clamp(16px, 4vw, 60px) 72px">
<div style="max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px; padding: 18px 0; border-bottom: 1px solid var(--line)">
<a href="Main.dc.html" style="display: flex; align-items: baseline; gap: 0.34em; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: -0.04em; color: var(--text); text-decoration: none"><svg viewBox="0 0 42 32" fill="none" aria-hidden="true" style="width: 0.97em; height: 0.74em; flex: 0 0 auto; display: block"><rect x="1.5" y="1.5" width="15" height="29" rx="3" stroke="currentColor" stroke-width="3"></rect><rect x="25.5" y="1.5" width="15" height="29" rx="3" fill="#C8F03C" stroke-width="3" style="stroke: var(--mark-edge)"></rect></svg><span>viral clone</span></a>
<nav aria-label="Main menu" style="display: flex; flex-wrap: wrap; gap: 4px">
<a href="Main.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; color: var(--text-3); text-decoration: none; font-weight: 500; font-size: 15px">Gallery</a>
<a href="A-Uretimlerim.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--raised); color: var(--text); text-decoration: none; font-weight: 500; font-size: 15px"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--accent-text)"></span>My videos</a>
<a href="A-Fiyatlar.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; color: var(--text-3); text-decoration: none; font-weight: 500; font-size: 15px">Pricing</a>
</nav>
<div style="display: flex; align-items: center; gap: 12px">
<span style="font-size: 13px; color: var(--text-2); border: 1px solid var(--edge); border-radius: 999px; padding: 8px 14px">[BALANCE] credits</span>
<a href="A-Hesap.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; color: var(--text); text-decoration: none; font-size: 15px; font-weight: 500">Account</a>
</div>
</header>

<section style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px">
<h1 style="margin: 0; flex: 9999 1 auto; font-family: var(--display); font-weight: 800; font-size: clamp(36px, 4.6vw, 64px); line-height: 0.95; letter-spacing: -0.035em">My videos</h1>
<div role="group" aria-label="Status" style="flex: 1 1 auto; min-width: 0; max-width: 100%; box-sizing: border-box; display: flex; overflow-x: auto; padding: 0 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--edge)">
<button type="button" aria-pressed="true" style="flex: 1 0 auto; display: flex; min-height: 44px; box-sizing: border-box; padding: 4px 0; border: 0; background: transparent; font: inherit; font-size: 15px; cursor: pointer; font-weight: 500; color: var(--text)"><span style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 0 14px; border-radius: 999px; white-space: nowrap; background: var(--raised)">All</span></button>
<button type="button" aria-pressed="false" style="flex: 1 0 auto; display: flex; min-height: 44px; box-sizing: border-box; padding: 4px 0; border: 0; background: transparent; font: inherit; font-size: 15px; cursor: pointer; color: var(--text-3)"><span style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 0 14px; border-radius: 999px; white-space: nowrap">Running</span></button>
<button type="button" aria-pressed="false" style="flex: 1 0 auto; display: flex; min-height: 44px; box-sizing: border-box; padding: 4px 0; border: 0; background: transparent; font: inherit; font-size: 15px; cursor: pointer; color: var(--text-3)"><span style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 0 14px; border-radius: 999px; white-space: nowrap">Done</span></button>
<button type="button" aria-pressed="false" style="flex: 1 0 auto; display: flex; min-height: 44px; box-sizing: border-box; padding: 4px 0; border: 0; background: transparent; font: inherit; font-size: 15px; cursor: pointer; color: var(--text-3)"><span style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 0 14px; border-radius: 999px; white-space: nowrap">Stopped</span></button>
</div>
</section>

<main style="display: flex; flex-direction: column">
<sc-for list="{{ jobs }}" as="j" hint-placeholder-count="3">
<article style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; padding: 16px 0; border-top: 1px solid var(--line)">
<img src="{{ j.img }}" alt="" style="flex: 0 0 72px; width: 72px; height: 128px; object-fit: cover; border-radius: 12px; display: block; box-shadow: 0 0 0 1px var(--media-edge)">
<div style="flex: 9999 1 160px; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
<div style="flex: 9999 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.25; text-wrap: pretty">{{ j.title }}</h2>
<p style="margin: 0; font-size: 13px; line-height: 1.4; color: var(--text-3)">{{ j.product }}</p>
<p style="margin: 0; font-size: 13px; line-height: 1.4; color: var(--text-3)">{{ j.spec }}</p>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<div style="min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: {{ j.color }}"><sc-if value="{{ j.notReady }}" hint-placeholder-val="{{ true }}"><span style="width: 8px; height: 8px; border-radius: {{ j.dot }}; background: {{ j.color }}"></span></sc-if><sc-if value="{{ j.ready }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>{{ j.status }}</span>
<span style="font-size: 13px; line-height: 1.4; color: var(--text-3)">{{ j.detail }}</span>
</div>
<sc-if value="{{ j.ready }}" hint-placeholder-val="{{ false }}"><a href="A-Video-Sil-Onay.dc.html" style="flex: 0 0 auto; display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 8px; color: var(--warn); font-size: 15px; font-weight: 500; text-decoration: none">Delete</a></sc-if>
</div>
</div>
<sc-if value="{{ j.generating }}" hint-placeholder-val="{{ true }}"><a href="A-Is-Takibi.dc.html" style="flex: 1 1 160px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 24px; border-radius: 12px; font-weight: 600; font-size: 15px; text-decoration: none; border: 1px solid var(--edge-strong); background: transparent; color: var(--text)">Watch</a></sc-if>
<sc-if value="{{ j.ready }}" hint-placeholder-val="{{ false }}"><a href="A-Sonuc.dc.html" style="flex: 1 1 160px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 24px; border-radius: 12px; font-weight: 600; font-size: 15px; text-decoration: none; border: 1px solid var(--edge-strong); background: transparent; color: var(--text)">Open</a></sc-if>
<sc-if value="{{ j.stopped }}" hint-placeholder-val="{{ false }}"><a href="A-Is-Durdu.dc.html" style="flex: 1 1 160px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 24px; border-radius: 12px; font-weight: 600; font-size: 15px; text-decoration: none; border: 1px solid var(--edge-strong); background: transparent; color: var(--text)">See options</a></sc-if>
</article>
</sc-for>
</main>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
var B = '/_blob/';
return {
theme: this.props.theme ?? 'dark',
jobs: [
{ img: B + 'f20a7ed7a7bc172a7da483415800077f', title: 'Fragrance layering recipe', product: '4 products: Aurora Body Oil, Body Mist, Hair Mist, Solace Perfume', spec: 'Fast · 1 variant', status: 'Running', generating: true, notReady: true, detail: 'Clips 3 / 5 · about 3 min left', color: 'var(--accent-text)', dot: '50%' },
{ img: B + '874b55ddf9761a230dda46e2aa4afa85', title: '"I tried it for 4 weeks" presenter story', product: '1 product: Lashly Eyelash Serum', spec: 'Fast · 1 variant · 30 sec', status: 'Done', ready: true, detail: 'mp4 · 720p', color: 'var(--accent-text)', dot: '50%' },
{ img: B + '619ee0e5a13e318118b291c1451be9b8', title: 'Fragrance layering recipe', product: '4 products: Aurora Body Oil, Body Mist, Hair Mist, Solace Perfume', spec: 'Fast · 1 variant', status: 'Stopped', stopped: true, notReady: true, detail: 'Credits returned · 3 of 5 clips saved', color: 'var(--warn)', dot: '2px' }
]
};
}
}
</script>
</body>
</html>
