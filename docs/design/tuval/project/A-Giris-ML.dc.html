<style>

.ay[data-theme="light"],.ay [data-theme="light"]{--bg:#F4F5EE;--surface:#FFFFFF;--raised:#E8EADF;--line:#E0E2D7;--edge:#CBCEBF;--edge-strong:#80856F;--text:#0B0C0A;--text-2:#3E4236;--text-3:#5A5F50;--accent-hover:#B6E01F;--accent-text:#456300;--warn:#A8400F;--warn-edge:#E3B7A2;--mark-edge:#0B0C0A;--media-edge:rgba(11,12,10,0.12)}
a{color:var(--accent-text)}a:hover{color:var(--text)}
</style>
</helmet>
<div class="ay" data-theme="{{ theme }}" style="min-height: 100vh; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: var(--body); display: flex; flex-direction: column">
<div style="padding: 0 clamp(16px, 4vw, 60px)">
<div style="max-width: 1320px; margin: 0 auto">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); container-type: inline-size">
<a href="A-Ana-Sayfa-ML.dc.html" style="display: flex; align-items: baseline; padding: 10px 0; min-width: 44px; white-space: nowrap; flex: 0 0 auto; gap: 0.34em; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: -0.04em; color: var(--text); text-decoration: none"><svg viewBox="0 0 42 32" fill="none" aria-hidden="true" style="width: 0.97em; height: 0.74em; flex: 0 0 auto; display: block"><rect x="1.5" y="1.5" width="15" height="29" rx="3" stroke="currentColor" stroke-width="3"></rect><rect x="25.5" y="1.5" width="15" height="29" rx="3" fill="#C8F03C" stroke-width="3" style="stroke: var(--mark-edge)"></rect></svg><span><span style="font-size: clamp(0px, (100cqi - 327.5px) * 9999, 1em); letter-spacing: -0.04em">viral clone</span></span></a>
<div style="display: flex; align-items: center; gap: 8px; min-width: 0">
<a href="A-Menu-Ziyaretci-ML.dc.html" aria-label="Open menu" style="width: 44px; height: 44px; flex: 0 0 auto; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: 1px solid var(--edge); color: var(--text); text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a>
</div>
</header>
</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column">

<section style="order: 2; flex: 0 0 auto; box-sizing: border-box; padding: 24px 16px; display: flex; flex-direction: row-reverse; align-items: center; justify-content: space-between; gap: 16px; background: var(--surface)">
<div style="flex: 0 0 auto; display: flex; align-items: flex-end; gap: 8px">
<img src="/_blob/1377349dbc87784232ac59cf9cf04986" alt="" style="flex: 0 0 40px; width: 40px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 8px; display: block; box-shadow: 0 0 0 1px var(--media-edge)">
<img src="/_blob/f20a7ed7a7bc172a7da483415800077f" alt="" style="flex: 0 0 52px; width: 52px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 8px; display: block; box-shadow: 0 0 0 1px var(--media-edge)">
<img src="/_blob/de5244c861eb9107996b5404d64ca159" alt="" style="flex: 0 0 40px; width: 40px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 8px; display: block; box-shadow: 0 0 0 1px var(--media-edge)">
</div>
<p style="margin: 0; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: -0.03em">Same video. <span style="display: block; color: var(--accent-text)">Your product.</span></p>
</section>

<main style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; padding: 32px 16px 24px; display: flex; align-items: flex-start; justify-content: center">
<div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 24px">
<div role="group" aria-label="Log in or sign up" style="display: flex; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--edge)">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2">
<button type="button" aria-pressed="{{ t.on }}" onClick="{{ t.pick }}" style="flex: 1; min-height: 44px; border-radius: 999px; border: 0; background: {{ t.bg }}; color: {{ t.fg }}; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{ t.label }}</button>
</sc-for>
</div>

<h1 style="margin: 0; font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; letter-spacing: -0.03em">{{ title }}</h1>
<sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: var(--text-2)">Your first video is free: one no-talking video in Fast quality. No card needed.</p>
</sc-if>

<button type="button" style="min-height: 52px; border-radius: 12px; border: 1px solid var(--edge-strong); background: transparent; color: var(--text); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Continue with Google</button>

<div aria-hidden="true" style="display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--text-3)"><span style="flex: 1; height: 1px; background: var(--line)"></span>or with email<span style="flex: 1; height: 1px; background: var(--line)"></span></div>

<form style="display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; color: var(--text-2)">Email
<input type="email" autocomplete="email" placeholder="name@example.com" style="min-height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1px solid var(--edge-strong); background: var(--surface); color: var(--text); font: inherit; font-size: 15px">
</label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; color: var(--text-2)">Password
<input type="password" autocomplete="current-password" style="min-height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1px solid var(--edge-strong); background: var(--surface); color: var(--text); font: inherit; font-size: 15px">
<sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; line-height: 1.4; color: var(--text-3)">At least 8 characters.</span>
</sc-if>
</label>
<sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
<a href="Main-ML.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 60px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 17px; text-decoration: none">Log in</a>
</sc-if>
<sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
<a href="A-Eposta-Dogrula-ML.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 60px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 17px; text-decoration: none">Sign up</a>
</sc-if>
</form>

<div style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 1.5; color: var(--text-3)">
<sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
<a href="A-Sifre-Unuttum-ML.dc.html" style="align-self: flex-start; display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 500; text-decoration: none">Forgot password</a>
</sc-if>
<sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
<p style="margin: 0">By signing up you accept the <a href="A-Yasal-ML.dc.html" style="padding: 16px 0">terms of use</a> and the <a href="A-Yasal-ML.dc.html" style="padding: 16px 0">privacy policy</a>.</p>
</sc-if>
</div>
</div>
</main>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var mode = (this.state && this.state.mode) || 'login';
var tabs = [
{ id: 'login', label: 'Log in' },
{ id: 'signup', label: 'Sign up' }
].map(function (t) {
var on = mode === t.id;
return { label: t.label, on: on, bg: on ? 'var(--raised)' : 'transparent', fg: on ? 'var(--text)' : 'var(--text-3)', pick: function () { self.setState({ mode: t.id }); } };
});
return {
theme: this.props.theme ?? 'light',
tabs: tabs,
isLogin: mode === 'login',
isSignup: mode === 'signup',
title: mode === 'login' ? 'Welcome back.' : 'Create your account.'
};
}
}
</script>
</body>
</html>
